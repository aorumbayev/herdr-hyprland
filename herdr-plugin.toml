id = "herdr-hyprland"
name = "Hyprland Keys"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Hyprland's window-management keymap for herdr panes and tabs"
platforms = ["linux", "macos"]

[[build]]
command = ["go", "build", "-o", "bin/herdr-hyprland", "./cmd/herdr-hyprland"]

# Writes the alt keymap preset into ~/.config/herdr/config.toml with a
# timestamped backup beside it. Additive: every herdr prefix+* default keeps
# working. `herdr config reset-keys` removes it again.
[[build]]
command = ["bin/herdr-hyprland", "setup"]

[[actions]]
id = "last-tab"
title = "Focus the previously focused tab"
contexts = ["workspace", "pane"]
command = ["bin/herdr-hyprland", "last-tab"]

[[events]]
on = "tab.focused"
command = ["bin/herdr-hyprland", "track"]

[[actions]]
id = "move-to-tab-1"
title = "Move pane to tab 1"
contexts = ["pane"]
command = ["bin/herdr-hyprland", "move-to-tab", "1"]

[[actions]]
id = "move-to-tab-2"
title = "Move pane to tab 2"
contexts = ["pane"]
command = ["bin/herdr-hyprland", "move-to-tab", "2"]

